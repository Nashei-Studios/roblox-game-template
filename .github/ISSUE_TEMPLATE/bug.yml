name: Bug
description: Something in the template is broken
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Include the command or the Studio step, and the exact output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations:
      required: true
