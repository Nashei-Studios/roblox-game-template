name: Brecha de UI
description: La interfaz se ve mal, se corta o no se entiende
labels: [ui, needs-triage]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué se ve mal
      description: Describe la pantalla y qué falla (texto cortado, botón tapado, demasiados botones).
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: En qué dispositivo
      options:
        - Celular
        - Tablet
        - PC
        - Consola o control
    validations:
      required: true
  - type: textarea
    id: captura
    attributes:
      label: Captura o referencia
      description: Pega una imagen o el enlace al juego de referencia.
  - type: textarea
    id: esperado
    attributes:
      label: Cómo debería verse
