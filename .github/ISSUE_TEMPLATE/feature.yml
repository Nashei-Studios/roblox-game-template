name: Feature or chore
description: New capability, tooling or documentation work
labels: [needs-triage]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One verifiable line per criterion.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: textarea
    id: investigacion
    attributes:
      label: Investigación
      description: Pistas para investigar antes del primer cambio (referentes y sus gameplays, módulos de la plantilla, kits u open source con licencia, qué entender con REA). Quien toma el issue investiga y deja un comentario `## Investigación` con enlaces comprobados antes de la primera PR.
      placeholder: "Referentes: ... · Módulos: ... · Kits: ..."