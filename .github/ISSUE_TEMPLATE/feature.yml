name: Feature or chore
description: New capability, tooling or documentation work
labels: [needs-triage]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One verifiable line per criterion.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
