name: stale

# Closes abandoned PRs with a comment (ADR gitflow). Drafts are never touched: they may be waiting for a
# Studio check. Label a PR `keep` to exempt it. Only `gh`, no third-party action.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CONFLICT_DAYS: "14"
  IDLE_DAYS: "30"

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Close conflicting or idle PRs
        run: |
          now=$(date +%s)
          conflict_cut=$((now - CONFLICT_DAYS * 86400))
          idle_cut=$((now - IDLE_DAYS * 86400))
          gh pr list --repo "$REPO" --state open --limit 100 --json number,isDraft,updatedAt,mergeable,labels \
            | jq -r --argjson c "$conflict_cut" --argjson i "$idle_cut" '
                .[] | select(.isDraft | not) | select(any(.labels[]; .name == "keep") | not)
                | (.updatedAt | fromdateiso8601) as $t
                | select(($t < $i) or (.mergeable == "CONFLICTING" and $t < $c))
                | "\(.number) \(if .mergeable == "CONFLICTING" then "has conflicts" else "is idle" end)"' \
            | while read -r number reason; do
                gh pr close "$number" --repo "$REPO" --delete-branch \
                  --comment "Closing automatically: this PR $reason and has had no activity for a long time. Reopen it (or restore the branch from this page) when the work continues; label it keep to exempt it."
              done
