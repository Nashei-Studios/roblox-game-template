name: analytics

# Daily read of this game's own Creator Analytics through Open Cloud (ADR 0023, vault decision 0021 stage 1).
# Skips cleanly until the repository variable ROBLOX_UNIVERSE_ID and the secret ROBLOX_ANALYTICS_KEY exist.
# The output is a private workflow artifact: benchmark values are never committed or printed
# (Roblox Terms of Use, Creator Analytics clause).
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    env:
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
    steps:
      - name: Check configuration
        id: config
        env:
          ROBLOX_ANALYTICS_KEY: ${{ secrets.ROBLOX_ANALYTICS_KEY }}
        run: |
          if [ -z "$ROBLOX_UNIVERSE_ID" ] || [ -z "$ROBLOX_ANALYTICS_KEY" ]; then
            echo "ROBLOX_UNIVERSE_ID or ROBLOX_ANALYTICS_KEY is not set, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.run == 'true'
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        if: steps.config.outputs.run == 'true'
        with:
          version: v1.2.0
          cache: "false"
      - name: Query own analytics
        if: steps.config.outputs.run == 'true'
        env:
          ROBLOX_ANALYTICS_KEY: ${{ secrets.ROBLOX_ANALYTICS_KEY }}
        run: lune run scripts/own-analytics logs/own-analytics.json 30
      - name: Upload private artifact
        if: steps.config.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: own-analytics
          path: logs/own-analytics.json
          retention-days: 30
          if-no-files-found: error
