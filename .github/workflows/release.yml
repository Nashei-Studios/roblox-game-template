name: release

# Inherited release train (Nashei-Studios/.github, docs/adr/0001): develop -> main by PR with a merge
# commit, SemVer tag, CHANGELOG.md and GitHub Release.
#   - on demand: gh workflow run release.yml
#   - weekly floor: Monday, only when develop holds a feat/fix/perf/tune commit since the last tag
# For Roblox games "production" is main plus its tag; publishing the place stays in Studio and the
# public switch stays with Victor, so nothing here touches Roblox.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    uses: Nashei-Studios/.github/.github/workflows/release-plan.yml@main
  gate:
    # The tree that ships was tested per PR, but two PRs merged one after the other were each tested
    # against an older develop: one more run on the combination.
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # A called workflow cannot ask for more than its caller grants: ci.yml ends in the pr-gate job.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [plan, gate]
    permissions:
      contents: write
      pull-requests: write
    uses: Nashei-Studios/.github/.github/workflows/release-publish.yml@main
    with:
      version: ${{ needs.plan.outputs.version }}
