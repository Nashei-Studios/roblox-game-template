name: ci

# One trigger per change (ADR 0029): every PR into develop or main runs the gate once and nothing
# re-runs it on push. The release PR develop -> main tests the combination of merged features.
# Docs-only changes and draft PRs cost no minutes. Jobs are merged because every job is
# billed as at least one minute and these steps take seconds (rules: github-integrado, minutos-actions).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [develop, main]
  workflow_call:

concurrency:
  # The draft flag is part of the group: a push while draft must not cancel the run that marking
  # the PR ready starts (it would leave every job skipped and the automerge never fires).
  group: ci-${{ github.head_ref || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job installs the pinned toolchain (rokit.toml) through the same community action,
# checked 2026-11-02 (CompeyDev/setup-rokit v0.2.1) and pinned by commit SHA.
jobs:
  changes:
    # Docs-only PRs skip the gate (no toolchain minutes) but must still be able to merge, so the
    # decision lives here instead of in paths-ignore, which would leave the PR with no run at all.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      gamedocs: ${{ steps.diff.outputs.gamedocs }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "gamedocs=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          # Game documents are docs, but their gate (ADR 0068) must run when they or the checker change.
          if printf '%s' "$files" | grep -Eq '^(docs/game/|scripts/(docs-check|DocsCheck)[.]luau$)'; then
            echo "gamedocs=true" >> "$GITHUB_OUTPUT"
          else
            echo "gamedocs=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s' "$files" | grep -Evq '(\.md$|^docs/|^\.vscode/|^\.github/(ISSUE_TEMPLATE/|CODEOWNERS|dependabot\.yml|release\.yml))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    # format + lint + generated remotes + PR title: all static, seconds each.
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: "true"
      - name: Conventional Commit PR title (squash merge uses it)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore)(\([a-z0-9/_-]+\))?!?: .+'             || { echo "PR title must follow Conventional Commits: $PR_TITLE"; exit 1; }
      - run: stylua --check .
      - run: selene .
      - name: Regenerate the remote layer (ADR 0015)
        run: pwsh scripts/generate-remotes.ps1
      - name: Fail when the generated code is stale
        run: git diff --exit-code -- src/shared/net/generated

  game-docs:
    # docs-check (ADR 0068): documents of the current stage are filled and carry evidence. One tool, seconds.
    needs: changes
    if: needs.changes.outputs.gamedocs == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: "true"
      - run: lune run scripts/docs-check

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: "true"
      - name: Generate Lune types and sourcemap
        run: |
          lune setup
          rojo sourcemap default.project.json -o sourcemap.json
      - name: Analyze (stable solver, blocking)
        run: >
          luau-lsp analyze --sourcemap sourcemap.json
          --definitions=@roblox=types/globalTypes.None.d.luau
          --base-luaurc .luaurc src tests scripts
      - name: Analyze (new solver, informational drift detector, ADR 0008)
        continue-on-error: true
        run: >
          luau-lsp analyze --flag:LuauSolverV2=true --sourcemap sourcemap.json
          --definitions=@roblox=types/globalTypes.None.d.luau
          --base-luaurc .luaurc src tests scripts

  test:
    # Unit tests, performance budget, build smoke and the 75 % line-coverage gate (ADR 0017).
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: "true"
      - name: Unit tests (Lune)
        run: lune run scripts/test
      - name: UI audit (static)
        run: lune run scripts/ui-audit
      - name: Performance budget (remote bandwidth)
        run: lune run scripts/perf-budget
      - name: Build smoke
        run: |
          mkdir -p places
          rojo build default.project.json -o places/ci.rbxl
      - name: Run the suites with coverage
        run: |
          mkdir -p logs
          luau --coverage scripts/test_luau.luau
          mv coverage.out logs/coverage.lcov
      - name: Gate (75 % of the total, per-file report)
        run: lune run scripts/coverage_report logs/coverage.lcov 75 src

  pr:
    # Inherited gate (Nashei-Studios/.github): Conventional title, linked issue and, when the repo
    # variable AUTOMERGE_ENABLED is "true", squash-merge into develop with the branch deleted and the
    # issues closed. Draft or the `hold` label blocks the merge. It runs only after the whole gate.
    needs: [changes, check, game-docs, analyze, test]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Nashei-Studios/.github/.github/workflows/pr-gate.yml@main
