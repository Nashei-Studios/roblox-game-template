name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Community action (CompeyDev/setup-rokit v0.2.1, checked 2026-11-02), pinned by commit SHA.
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: "true"
      - name: Format check
        run: stylua --check .
      - name: Lint
        run: selene .
      - name: Unit tests (Lune)
        run: lune run scripts/test
