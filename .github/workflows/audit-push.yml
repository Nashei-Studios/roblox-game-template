name: audit-push

# Detective control for the permanent branches (ADR 0066). A private repo on the Free plan cannot
# enforce branch rules, so every push to main or develop is checked after the fact:
#   - a forced push or a push that is not a PR merge opens an issue with the SHA to restore
#   - the previous tip is kept under refs/backup/ so nothing is lost to a rewrite
# Costs a few seconds per push (no checkout); timeout 2 minutes.
on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  issues: write

concurrency:
  group: audit-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep the previous tip and flag unexpected pushes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$BEFORE" != "$zero" ]; then
            ref="refs/backup/${BRANCH}/$(date -u +%Y%m%dT%H%M%SZ)"
            gh api -X POST "repos/$REPO/git/refs" -f ref="$ref" -f sha="$BEFORE" --silent || true
          fi
          prs=$(gh api "repos/$REPO/commits/$AFTER/pulls" --jq 'length' 2>/dev/null || echo 0)
          reason=""
          if [ "$FORCED" = "true" ]; then reason="forced push (history rewritten)"; fi
          if [ -z "$reason" ] && [ "$prs" = "0" ] && [ "$ACTOR" != "github-actions[bot]" ]; then
            reason="direct push without a pull request"
          fi
          if [ -z "$reason" ]; then echo "ok: $BRANCH moved through a PR"; exit 0; fi
          gh issue create --repo "$REPO" \
            --title "audit-push: $reason on $BRANCH" \
            --body "Branch \`$BRANCH\` moved from \`$BEFORE\` to \`$AFTER\` by @$ACTOR: $reason.

          The previous tip is kept under \`refs/backup/$BRANCH/\`. To restore it: \`git push origin $BEFORE:refs/heads/$BRANCH --force-with-lease\` after the team agrees.

          Rule: main and develop only move through pull requests (ADR 0066)."
